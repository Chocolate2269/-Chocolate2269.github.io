<!DOCTYPE html>
<html>
<head>
    <title>VibeInvest Login</title>
    <style>
        body{background:#0f0f1a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial}
        .box{background:#1a1a2e;padding:40px;border-radius:10px;width:300px}
        input{width:100%;padding:12px;margin:10px 0;background:#2a2a3e;border:solid #444;color:white;border-radius:8px}
        button{width:100%;padding:12px;background:#ff3d8a;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px}
    </style>
</head>
<body>
    <div class="box">
        <h2>Welcome to VibeInvest</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="signUp()">Sign Up</button>
        <button onclick="login()">Login</button>
        <p id="msg"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
</body>
</html>
